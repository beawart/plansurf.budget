<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Planner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpath d='M16 23h32v27H16z' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M22 23v-5h20v5M23 32h18M23 41h10' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f2;--surface:#fff;--surface-alt:#f0efeb;--border:#e0ddd5;--text:#1a1a18;--text-sec:#6b6960;--text-dim:#9e9b90;--accent:#1d4ed8;--accent-light:#eff6ff;--green:#16a34a;--green-bg:#f0fdf4;--red:#dc2626;--red-bg:#fef2f2;--amber:#d97706;--amber-bg:#fffbeb;--purple:#7c3aed;--purple-bg:#f5f3ff;--teal:#0d9488;--teal-bg:#f0fdfa;--radius:10px;--radius-lg:14px;--shadow:0 1px 3px rgba(0,0,0,.06);--shadow-lg:0 8px 24px rgba(0,0,0,.08);}
[data-theme="dark"]{--bg:#0f0f0e;--surface:#1a1a18;--surface-alt:#222220;--border:#333330;--text:#ececea;--text-sec:#a0a098;--text-dim:#686860;--accent-light:#0c1f3f;--green-bg:#052e16;--red-bg:#2a0f0f;--amber-bg:#2a210a;--purple-bg:#2e0a4a;--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 8px 24px rgba(0,0,0,.4);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}
button{cursor:pointer;font-family:inherit;}input,textarea,select{font-family:inherit;font-size:inherit;}

.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.hdr h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
.hdr .app-tag{font-size:12px;color:var(--accent);background:var(--accent-light);padding:3px 10px;border-radius:12px;font-weight:600;}
.hdr-r{display:flex;gap:6px;align-items:center;}
.sync-status{font-size:11px;color:var(--text-sec);max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ibtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-sec);font-size:15px;transition:.15s;}
.ibtn:hover{background:var(--surface-alt);}
.ibtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}

.layout{max-width:1200px;margin:0 auto;padding:20px 28px;}
@media(max-width:700px){
  .hdr{padding:9px 12px;}.hdr h1{font-size:15px;}.hdr .app-tag{display:none;}.sync-status{display:none;}
  .layout{padding:12px;}.month-nav{gap:6px;margin-bottom:14px;}.month-nav h2{flex:1;min-width:0;font-size:18px;}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px;}.scard{padding:12px;}.scard .val{font-size:21px;}.scard .icon{top:10px;right:10px;font-size:19px;}
  .chart-sec,.cat-sec,.tx-sec{padding:14px 12px;margin-bottom:12px;}.cat-grid{grid-template-columns:1fr;}
  .add-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}.add-row input[type="text"]{grid-column:1 / -1;min-width:0;}.add-row input[type="number"]{width:auto;}.add-row input,.add-row select,.add-row button{width:100%;min-width:0;}
  .table-tools{gap:6px;}.table-tools input{min-width:0;flex-basis:100%;}.table-tools .count{margin-left:0;}.tx-table{min-width:620px;}.tx-acts{opacity:1;}
}

/* Month nav */
.month-nav{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
.month-nav h2{font-size:20px;font-weight:700;min-width:180px;text-align:center;}
.mnav{background:none;border:1px solid var(--border);color:var(--text-sec);font-size:16px;padding:5px 11px;border-radius:6px;}
.mnav:hover{background:var(--surface-alt);}

/* Stats cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px;}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.scard .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);}
.scard .val{font-size:26px;font-weight:700;margin-top:4px;}
.scard .sub{font-size:11px;color:var(--text-sec);margin-top:2px;}
.scard .icon{position:absolute;top:14px;right:14px;font-size:24px;opacity:.3;}

.abtn{background:none;border:none;color:var(--text-dim);font-size:13px;padding:3px 5px;border-radius:4px;}
.abtn:hover{background:var(--surface-alt);color:var(--text);}
.abtn.del:hover{color:var(--red);}

/* Bar chart */
.chart-sec,.cat-sec,.tx-sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow);}
.chart-sec{margin-bottom:16px;}
.cat-sec,.tx-sec{margin-bottom:16px;}
.chart-sec h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:14px;}
.bar-chart{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;height:190px;position:relative;}
.chart-scale{display:flex;flex-direction:column;justify-content:space-between;padding-bottom:24px;color:var(--text-dim);font-size:10px;text-align:right;white-space:nowrap;}
.chart-plot{display:flex;align-items:stretch;gap:6px;position:relative;min-width:0;}
.chart-grid{position:absolute;inset:0 0 24px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;}
.chart-grid span{width:100%;border-top:1px solid var(--border);}
.bar-group{flex:1;display:flex;gap:3px;align-items:flex-end;justify-content:center;position:relative;z-index:1;min-width:0;padding-bottom:24px;}
.bar{border-radius:4px 4px 0 0;min-width:8px;max-width:32px;flex:1;transition:height .4s;cursor:default;}
.bar:hover{opacity:.8;}
.bar-label{position:absolute;bottom:0;font-size:10px;color:var(--text-dim);text-align:center;width:100%;}
.chart-empty{padding:36px 12px;text-align:center;color:var(--text-sec);font-size:13px;}
.chart-legend{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--text-sec);}
.chart-legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle;}
.legend-income::before{background:var(--green)!important;}
.legend-expense::before{background:var(--red)!important;}
.legend-investment::before{background:var(--purple)!important;}

/* Category breakdown */
.cat-sec h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:14px;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px;}
.cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.cat-info{flex:1;min-width:0;}
.cat-name{font-size:12px;font-weight:600;}
.cat-amt{font-size:14px;font-weight:700;}
.cat-pct{font-size:10px;color:var(--text-dim);}
.cat-bar{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
.cat-fill{height:100%;border-radius:2px;}

/* Transactions */
.tx-sec h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.tx-sec h3 .btn{font-size:11px;padding:6px 10px;text-transform:none;white-space:nowrap;}
.tx-table{width:100%;border-collapse:separate;border-spacing:0;}
.tx-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);}
.tx-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
.tx-table tr{background:var(--surface);transition:.12s;}
.tx-table tr:hover{background:var(--surface-alt);}
.table-tools{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.table-tools input{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-alt);color:var(--text);font-size:12px;outline:none;}
.table-tools input:focus{border-color:var(--accent);}
.table-tools .count{font-size:11px;color:var(--text-dim);margin-left:auto;}
.sort-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text-sec);font-size:11px;font-weight:600;}
.sort-btn:hover{background:var(--surface-alt);color:var(--text);}
.edit-cell{width:100%;padding:6px 8px;border:1px solid var(--accent);border-radius:6px;background:var(--surface-alt);color:var(--text);font-size:12px;outline:none;}
.edit-cell:focus{box-shadow:0 0 0 2px var(--accent-light);}
.row-edit-actions{display:flex;gap:4px;white-space:nowrap;}
.row-edit-actions .abtn.save{color:var(--green);}.row-edit-actions .abtn.cancel{color:var(--text-sec);}
.tx-type{font-weight:700;}
.tx-type.income{color:var(--green);}
.tx-type.expense{color:var(--red);}
.tx-type.investment{color:var(--purple);}
.tx-type.transfer{color:var(--text-sec);}
.tx-cat-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.tx-acts{display:flex;gap:2px;opacity:0;transition:.15s;}
tr:hover .tx-acts{opacity:1;}

/* Add form */
.add-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.add-row input,.add-row select{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-alt);color:var(--text);font-size:12px;outline:none;}
.add-row input:focus{border-color:var(--accent);}
.add-row input[type="text"]{flex:1;min-width:140px;}
.add-row input[type="number"]{width:110px;}
.btn{padding:9px 16px;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;transition:.15s;}
.btn-p{background:var(--accent);color:#fff;}.btn-p:hover{opacity:.9;}
.btn-g{background:none;color:var(--text-sec);border:1px solid var(--border);}.btn-g:hover{background:var(--surface-alt);}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;animation:fi .15s;}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:22px;width:420px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:su .2s;}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--text-sec);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px;}
.fg input,.fg select{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-alt);color:var(--text);font-size:13px;outline:none;}
.fg input:focus{border-color:var(--accent);}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.statement-modal{width:1000px;max-width:96vw;}
.statement-summary{font-size:12px;color:var(--text-sec);margin:-6px 0 12px;}
.import-table-wrap{max-height:52vh;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);}
.import-table{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;}
.import-table th{position:sticky;top:0;z-index:2;background:var(--surface-alt);font-size:10px;text-transform:uppercase;color:var(--text-dim);text-align:left;padding:8px;border-bottom:1px solid var(--border);}
.import-table td{font-size:12px;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.import-table tr:last-child td{border-bottom:0;}
.import-date{white-space:nowrap;color:var(--text-sec);}
.import-description{min-width:210px;max-width:330px;overflow-wrap:anywhere;}
.import-table select{width:145px;max-width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:11px;}
.import-duplicate{background:var(--amber-bg);}
.import-warning{display:block;font-size:10px;color:var(--amber);}
.import-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;}
.import-actions .macts{margin:0;}
.import-error{font-size:12px;color:var(--red);background:var(--red-bg);padding:9px 12px;border-radius:var(--radius);margin:0 0 12px;}
.import-actions button:disabled{opacity:.5;cursor:not-allowed;}

.sync-note{font-size:12px;color:var(--text-sec);background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;}
.sync-note strong{color:var(--text);}
.sync-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/papaparse@5.5.3/papaparse.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const S='budget-planner-v1';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d;}catch{return d;}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const uid=()=>Math.random().toString(36).substr(2,9)+Date.now().toString(36);
const API_BASE_URL=(window.__PLANSURF_API__ || 'https://plansurf-budget.onrender.com').replace(/\/$/, '');
const DEFAULT_SYNC_CONFIG={apiBaseUrl:API_BASE_URL};
const getSyncConfig=()=>{const saved=load('budget-planner-api-v1',{});return{apiBaseUrl:saved.apiBaseUrl||API_BASE_URL};};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const mk=(y,m)=>`${y}-${String(m+1).padStart(2,'0')}`;
const fmt=n=>n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

const CATEGORIES=[
  {id:'salary',label:'Salary',icon:'💰',color:'#16a34a',type:'income'},
  {id:'freelance',label:'Freelance',icon:'💻',color:'#2563eb',type:'income'},
  {id:'investment',label:'Investment',icon:'📈',color:'#9333ea',type:'investment'},
  {id:'transfer',label:'Transfer',icon:'↔️',color:'#64748b',type:'transfer'},
  {id:'rental-income',label:'Rental Income',icon:'🏘️',color:'#0891b2',type:'income'},
  {id:'other-income',label:'Other Income',icon:'🎁',color:'#0891b2',type:'income'},
  {id:'rent',label:'Rent / Mortgage',icon:'🏠',color:'#dc2626',type:'expense'},
  {id:'groceries',label:'Groceries',icon:'🛒',color:'#ea580c',type:'expense'},
  {id:'transport',label:'Transport',icon:'🚗',color:'#d97706',type:'expense'},
  {id:'utilities',label:'Utilities',icon:'⚡',color:'#0d9488',type:'expense'},
  {id:'entertainment',label:'Entertainment',icon:'🎬',color:'#e11d48',type:'expense'},
  {id:'holiday',label:'Holiday',icon:'✈️',color:'#2563eb',type:'expense'},
  {id:'dining',label:'Dining Out',icon:'🍽️',color:'#be185d',type:'expense'},
  {id:'health',label:'Health',icon:'🏥',color:'#16a34a',type:'expense'},
  {id:'shopping',label:'Shopping',icon:'🛍️',color:'#7c3aed',type:'expense'},
  {id:'education',label:'Education',icon:'📚',color:'#2563eb',type:'expense'},
  {id:'insurance',label:'Insurance',icon:'🛡️',color:'#4f46e5',type:'expense'},
  {id:'subscriptions',label:'Subscriptions',icon:'📱',color:'#6366f1',type:'expense'},
  {id:'other-expense',label:'Other',icon:'📦',color:'#64748b',type:'expense'},
];
const CAT_MAP={};CATEGORIES.forEach(c=>CAT_MAP[c.id]=c);
const isInvestment=tx=>tx.category==='investment'||tx.type==='investment';
const parseStatementDate=value=>{
  const parts=String(value||'').trim().split(/[/-]/);
  if(parts.length!==3)return null;
  const [day,month,year]=parts[0].length===4?[parts[2],parts[1],parts[0]]:parts;
  if(!/^\d{4}$/.test(year)||!/^\d{1,2}$/.test(month)||!/^\d{1,2}$/.test(day))return null;
  const parsed=new Date(Date.UTC(Number(year),Number(month)-1,Number(day)));
  if(parsed.getUTCFullYear()!==Number(year)||parsed.getUTCMonth()!==Number(month)-1||parsed.getUTCDate()!==Number(day))return null;
  return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
};
const parseStatementAmount=value=>{
  const text=String(value??'').trim();
  if(!text)return null;
  const negative=/^\(.*\)$/.test(text);
  const amount=Number(text.replace(/[,$\s()]/g,''));
  return Number.isFinite(amount)?(negative?-Math.abs(amount):amount):null;
};
const statementFingerprint=tx=>`${tx.date}|${tx.desc.trim().toLowerCase()}|${Number(tx.amount).toFixed(2)}`;
const inferCategory=description=>{
  const text=description.toLowerCase();
  const rules=[
    ['transfer',['funds tfer','funds transfer','bpay nab cards','anz mobile banking payment','payment to beawarwala taha','online payment received']],
    ['salary',['salary','payroll','paycheck','wages']],['freelance',['freelance','client work','contract work']],
    ['investment',['investment','dividend','stock sale','interest','vanguard','spaceship']],['rental-income',['rental income','rent received','tenant payment','tenant rent','property rent','ray white']],
    ['other-income',['bonus','gift','refund','cashback','reversal']],
    ['rent',['rent','mortgage','landlord']],['groceries',['grocery','groceries','supermarket','food shop','coles','woolworths','day to day supermarket']],
    ['transport',['uber','lyft','taxi','fuel','gas station','petrol','parking','train','bus','7-eleven','seven eleven','reddy express']],
    ['utilities',['electric','electricity','water bill','utility','utilities','internet','phone bill','energy locals']],
    ['entertainment',['movie','cinema','concert','game','entertainment','trybooking']],['holiday',['flight','hotel','airbnb','vacation','holiday','travel','jetstar']],
    ['dining',['restaurant','dinner','lunch','breakfast','coffee','takeout','takeaway','dining','sharetea','yo-chi','yo- chi','domino','teriyaki','cafe','smash burger']],['health',['doctor','dentist','pharmacy','medicine','health','chemist warehouse']],
    ['shopping',['shopping','clothes','clothing','amazon','mall','rebel','kmart','smiggle','target','reject shop','temu','spotlight','payin4','bunnings']],['groceries',['natures green farm','green grocer','farmers market','produce market']],
    ['education',['course','tuition','school','book','education']],
    ['insurance',['insurance','insure','allianz','gmhba','budget direct']],['subscriptions',['netflix','spotify','subscription','membership']],['other-expense',['expense']]
  ];
  const match=rules.find(([,keywords])=>keywords.some(keyword=>text.includes(keyword)));
  return match?.[0]||null;
};

function App(){
  const now=new Date();
  const [transactions,setTransactions]=useState(()=>load(S+'-tx',{}));
  const [goals,setGoals]=useState(()=>load(S+'-goals',[]));
  const [curMonth,setCurMonth]=useState(now.getMonth());
  const [curYear,setCurYear]=useState(now.getFullYear());
  const [dark,setDark]=useState(()=>localStorage.getItem('bp-dark')==='1');
  const [syncModal,setSyncModal]=useState(false);
  const [syncConfig,setSyncConfig]=useState(getSyncConfig);
  const [sessionToken,setSessionToken]=useState('');
  const [syncStatus,setSyncStatus]=useState('Ready');
  const [dirty,setDirty]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const syncReady=useRef(false);
  const suppressDirty=useRef(false);
  const [desc,setDesc]=useState('');
  const [amt,setAmt]=useState('');
  const [cat,setCat]=useState('salary');
  const [txDate,setTxDate]=useState(now.toISOString().split('T')[0]);
  const [statementPreview,setStatementPreview]=useState(null);
  const [statementImportError,setStatementImportError]=useState('');
  const statementFileInput=useRef(null);

  useEffect(()=>{save(S+'-tx',transactions);},[transactions]);
  useEffect(()=>{save(S+'-goals',goals);},[goals]);
  useEffect(()=>{
    if(syncReady.current){
      if(suppressDirty.current)suppressDirty.current=false;
      else{setDirty(true);setSyncStatus('Unsaved local changes');}
    }
  },[transactions,goals]);
  useEffect(()=>{syncReady.current=true;},[]);
  useEffect(()=>{document.documentElement.setAttribute('data-theme',dark?'dark':'light');localStorage.setItem('bp-dark',dark?'1':'0');},[dark]);

  const key=mk(curYear,curMonth);
  const monthTx=transactions[key]||[];

  // Add transaction
  const addTx=(e)=>{
    e.preventDefault();
    if(!desc.trim()||!amt)return;
    const catInfo=CAT_MAP[cat];
    const tx={id:uid(),desc:desc.trim(),amount:parseFloat(amt),category:cat,type:catInfo?.type||'expense',date:txDate};
    const txKey=mk(new Date(txDate).getFullYear(),new Date(txDate).getMonth());
    setTransactions(p=>({...p,[txKey]:[...(p[txKey]||[]),tx]}));
    setDesc('');setAmt('');
  };
  const updateTx=(originalKey,updatedTx)=>{
    const nextDateKey=mk(new Date(updatedTx.date).getFullYear(),new Date(updatedTx.date).getMonth());
    setTransactions(p=>{
      const remaining=(p[originalKey]||[]).filter(t=>t.id!==updatedTx.id);
      if(nextDateKey===originalKey)return {...p,[originalKey]:[...remaining,updatedTx]};
      return {...p,[originalKey]:remaining,[nextDateKey]:[...(p[nextDateKey]||[]),updatedTx]};
    });
  };
  const deleteTx=(id)=>{setTransactions(p=>({...p,[key]:(p[key]||[]).filter(t=>t.id!==id)}));};

  const parseStatementFile=e=>{
    const file=e.target.files?.[0];
    e.target.value='';
    if(!file)return;
    setStatementImportError('');
    if(!window.Papa){setStatementImportError('The CSV parser did not load. Check your internet connection and try again.');return;}
    window.Papa.parse(file,{
      header:false,
      skipEmptyLines:'greedy',
      complete:result=>{
        const records=result.data;
        const firstRow=records[0]||[];
        const headers=firstRow.map(value=>String(value||'').replace(/^\uFEFF/,'').trim().toLowerCase());
        const dateIndex=headers.indexOf('date');
        const descriptionIndex=headers.indexOf('description');
        const amountIndex=headers.indexOf('amount');
        const hasHeaders=dateIndex>=0&&descriptionIndex>=0&&amountIndex>=0;
        const isHeaderlessAnz=!hasHeaders&&parseStatementDate(firstRow[0])!==null&&parseStatementAmount(firstRow[1])!==null&&Boolean(String(firstRow[2]||'').trim());
        if(!hasHeaders&&!isHeaderlessAnz){
          setStatementImportError('This CSV format is not recognized. Expected Date, Description, and Amount columns, or an ANZ date/amount/description export.');
          return;
        }

        const known=new Set(Object.values(transactions).flat().map(statementFingerprint));
        let skippedRows=0;
        const dataRows=hasHeaders?records.slice(1):records;
        const dateColumn=hasHeaders?dateIndex:0;
        const descriptionColumn=hasHeaders?descriptionIndex:2;
        const amountColumn=hasHeaders?amountIndex:1;
        const items=dataRows.flatMap(row=>{
          const date=parseStatementDate(row[dateColumn]);
          const desc=String(row[descriptionColumn]||'').trim();
          const signedAmount=parseStatementAmount(row[amountColumn]);
          if(!date||!desc||signedAmount===null||signedAmount===0){skippedRows++;return [];}
          const suggested=inferCategory(desc);
          const direction=hasHeaders?(signedAmount>0?'expense':'income'):(signedAmount>0?'income':'expense');
          const category=suggested==='investment'||suggested==='transfer'||(suggested&&CAT_MAP[suggested]?.type===direction)
            ?suggested
            :direction==='income'?'other-income':'other-expense';
          const item={date,desc,amount:Math.abs(signedAmount),category,duplicate:false,include:true};
          const fingerprint=statementFingerprint(item);
          item.duplicate=known.has(fingerprint);
          item.include=!item.duplicate;
          known.add(fingerprint);
          return [item];
        });
        if(!items.length){setStatementImportError('No valid transactions were found in this CSV.');return;}
        setStatementPreview({fileName:file.name,items,skippedRows,format:hasHeaders?'card':'ANZ'});
      },
      error:error=>setStatementImportError(`Could not read this CSV: ${error.message}`)
    });
  };

  const addStatementTransactions=items=>{
    const selected=items.filter(item=>item.include);
    if(!selected.length)return;
    const groups={};
    selected.forEach(item=>{
      const monthKey=item.date.slice(0,7);
      const category=CAT_MAP[item.category]?item.category:'other-expense';
      (groups[monthKey]||(groups[monthKey]=[])).push({
        id:uid(),desc:item.desc,amount:item.amount,category,type:CAT_MAP[category].type,date:item.date
      });
    });
    setTransactions(current=>{
      const next={...current};
      Object.entries(groups).forEach(([monthKey,rows])=>{next[monthKey]=[...(next[monthKey]||[]),...rows];});
      return next;
    });
    const latestDate=selected.map(item=>item.date).sort().at(-1).split('-');
    setCurYear(Number(latestDate[0]));
    setCurMonth(Number(latestDate[1])-1);
    setSyncStatus(`${selected.length} transactions imported`);
    setStatementPreview(null);
  };

  // Stats
  const income=monthTx.filter(t=>t.type==='income'&&!isInvestment(t)).reduce((s,t)=>s+Number(t.amount||0),0);
  const expenses=monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0);
  const investments=monthTx.filter(isInvestment).reduce((s,t)=>s+Number(t.amount||0),0);
  const balance=income-expenses;
  const savingsRate=income>0?Math.round((balance/income)*100):0;

  // Category breakdown
  const catBreakdown=useMemo(()=>{
    const map={};
    monthTx.filter(t=>t.type==='expense').forEach(t=>{
    map[t.category]=(map[t.category]||0)+Number(t.amount||0);
    });
    return CATEGORIES.filter(c=>c.type==='expense'&&map[c.id]).map(c=>({...c,amount:map[c.id],pct:expenses>0?Math.round(map[c.id]/expenses*100):0})).sort((a,b)=>b.amount-a.amount);
  },[monthTx,expenses]);

  // Bar chart — last 6 months
  const chartData=useMemo(()=>{
    const data=[];
    for(let i=5;i>=0;i--){
      let m=curMonth-i,y=curYear;
      while(m<0){m+=12;y--;}
      const k2=mk(y,m);
      const txs=transactions[k2]||[];
      const inc=txs.filter(t=>t.type==='income'&&!isInvestment(t)).reduce((s,t)=>s+t.amount,0);
      const exp=txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
      const inv=txs.filter(isInvestment).reduce((s,t)=>s+Number(t.amount||0),0);
      data.push({label:MONTHS[m].substr(0,3),income:inc,expense:exp,investment:inv});
    }
    return data;
  },[transactions,curMonth,curYear]);
  const chartMax=Math.max(...chartData.flatMap(d=>[d.income,d.expense,d.investment]),1);
  const chartHasData=chartData.some(d=>d.income>0||d.expense>0||d.investment>0);
  const chartTick=value=>`$${new Intl.NumberFormat(undefined,{notation:'compact',maximumFractionDigits:1}).format(value)}`;

  const prevMonth=()=>{if(curMonth===0){setCurMonth(11);setCurYear(curYear-1);}else setCurMonth(curMonth-1);};
  const nextMonth=()=>{if(curMonth===11){setCurMonth(0);setCurYear(curYear+1);}else setCurMonth(curMonth+1);};

  const syncData={version:1,app:'plansurf-budget',transactions,goals,updatedAt:new Date().toISOString()};
  const apiUrl=(config,path)=>`${(config.apiBaseUrl||API_BASE_URL).replace(/\/$/,'')}${path}`;
  const saveSyncConfig=config=>{setSyncConfig(config);save('budget-planner-api-v1',config);};
  const apiRequest=async(config,path,options={})=>{
    const response=await fetch(apiUrl(config,path),{
      ...options,
      headers:{'Content-Type':'application/json',...(sessionToken?{Authorization:`Bearer ${sessionToken}`}:{}) ,...(options.headers||{})},
      cache:'no-store'
    });
    const payload=await response.json().catch(()=>({error:'The API returned an invalid response.'}));
    if(!response.ok)throw new Error(payload.error||`API request failed (${response.status}).`);
    return payload;
  };
  const loginApi=async(config,password)=>{
    setSyncing(true);setSyncStatus('Signing in...');
    try{
      saveSyncConfig(config);
      const payload=await apiRequest(config,'/api/login',{method:'POST',body:JSON.stringify({password}),headers:{}});
      setSessionToken(payload.token);setSyncStatus('Signed in');
      return true;
    }catch(error){setSyncStatus('Sign in failed: '+error.message);return false;}
    finally{setSyncing(false);}
  };
  const logoutApi=async(config=syncConfig)=>{
    try{if(sessionToken)await apiRequest(config,'/api/logout',{method:'POST'});}catch{}
    setSessionToken('');setSyncStatus('Signed out');
  };
  const applySyncData=d=>{
    if(!d||d.app!=='plansurf-budget'||typeof d.transactions!=='object'||!Array.isArray(d.goals))throw new Error('The JSON file is not a valid PlanSurf budget backup.');
    suppressDirty.current=true;setTransactions(d.transactions);setGoals(d.goals);
  };
  const pullGitHub=async(config=syncConfig)=>{
    if(!sessionToken){setSyncStatus('Sign in before syncing budget data');return;}
    if(dirty&&!window.confirm('Pulling will replace unsaved local changes. Continue?'))return;
    setSyncing(true);setSyncStatus('Loading budget...');
    try{
      applySyncData(await apiRequest(config,'/api/budget'));
      setDirty(false);setSyncStatus('Budget synced');
    }catch(error){setSyncStatus('Pull failed: '+error.message);}
    finally{setSyncing(false);}
  };
  const pushGitHub=async(config=syncConfig)=>{
    if(!sessionToken){setSyncStatus('Sign in before syncing budget data');return;}
    setSyncing(true);setSyncStatus('Saving budget...');
    try{
      await apiRequest(config,'/api/budget',{method:'PUT',body:JSON.stringify(syncData)});
      setDirty(false);setSyncStatus('Budget saved');
    }catch(error){setSyncStatus('Backup failed: '+error.message);}
    finally{setSyncing(false);}
  };

  return(
    <div>
      <div className="hdr">
        <h1>💵 Budget Planner <span className="app-tag">PlanSurf</span></h1>
        <div className="hdr-r">
          <span className="sync-status">{syncStatus}</span>
          <button className="ibtn" title="Budget sync" onClick={()=>setSyncModal(true)}>☁</button>
          <button className={`ibtn ${dark?'on':''}`} onClick={()=>setDark(!dark)}>{dark?'☀':'☾'}</button>
        </div>
      </div>
      <div className="layout">
        {/* Month nav */}
        <div className="month-nav">
          <button className="mnav" onClick={prevMonth}>‹</button>
          <h2>{MONTHS[curMonth]} {curYear}</h2>
          <button className="mnav" onClick={nextMonth}>›</button>
        </div>

        {/* Stats */}
        <div className="stats">
          <div className="scard"><span className="icon">📥</span><div className="label">Income</div><div className="val" style={{color:'var(--green)'}}>$ {fmt(income)}</div></div>
          <div className="scard"><span className="icon">📤</span><div className="label">Expenses</div><div className="val" style={{color:'var(--red)'}}>$ {fmt(expenses)}</div></div>
          <div className="scard"><span className="icon">📈</span><div className="label">Investments</div><div className="val" style={{color:'var(--purple)'}}>$ {fmt(investments)}</div></div>
          <div className="scard"><span className="icon">💰</span><div className="label">Balance</div><div className="val" style={{color:balance>=0?'var(--green)':'var(--red)'}}>$ {fmt(balance)}</div><div className="sub">{balance>=0?'Under budget ✓':'Over budget ⚠'}</div></div>
          <div className="scard"><span className="icon">📊</span><div className="label">Savings Rate</div><div className="val" style={{color:'var(--accent)'}}>{savingsRate}%</div></div>
        </div>

        {/* Bar chart */}
        <div className="chart-sec">
          <h3>6-Month Comparison</h3>
          {chartHasData?(
            <>
              <div className="bar-chart">
                <div className="chart-scale" aria-hidden="true">
                  {[chartMax,chartMax/2,0].map((value,i)=><span key={i}>{chartTick(value)}</span>)}
                </div>
                <div className="chart-plot">
                  <div className="chart-grid" aria-hidden="true"><span></span><span></span><span></span></div>
                  {chartData.map((d,i)=>(
                    <div className="bar-group" key={i} aria-label={`${d.label}: income $${fmt(d.income)}, expenses $${fmt(d.expense)}, investments $${fmt(d.investment)}`}>
                      <div className="bar" style={{height:`${(d.income/chartMax)*100}%`,background:'var(--green)',minHeight:d.income?4:0}} title={`Income: $${fmt(d.income)}`}></div>
                      <div className="bar" style={{height:`${(d.expense/chartMax)*100}%`,background:'var(--red)',minHeight:d.expense?4:0}} title={`Expenses: $${fmt(d.expense)}`}></div>
                      <div className="bar" style={{height:`${(d.investment/chartMax)*100}%`,background:'var(--purple)',minHeight:d.investment?4:0}} title={`Investments: $${fmt(d.investment)}`}></div>
                      <span className="bar-label">{d.label}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="chart-legend">
                <span className="legend-income">Income</span>
                <span className="legend-expense">Expenses</span>
                <span className="legend-investment">Investments</span>
              </div>
            </>
          ):<div className="chart-empty">No income, expenses, or investments recorded in the last six months.</div>}
        </div>

        {/* Category breakdown */}
        {catBreakdown.length>0&&(
          <div className="cat-sec">
            <h3>📂 Expense Breakdown</h3>
            <div className="cat-grid">
              {catBreakdown.map(c=>(
                <div className="cat-card" key={c.id}>
                  <div className="cat-icon" style={{background:c.color+'20'}}>{c.icon}</div>
                  <div className="cat-info">
                    <div className="cat-name">{c.label}</div>
                    <div className="cat-amt" style={{color:c.color}}>$ {fmt(c.amount)}</div>
                    <div className="cat-bar"><div className="cat-fill" style={{width:`${c.pct}%`,background:c.color}}></div></div>
                  </div>
                  <div className="cat-pct">{c.pct}%</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Add transaction */}
        <div className="tx-sec">
          <h3>💳 Transactions
            <button type="button" className="btn btn-g" onClick={()=>{setStatementImportError('');statementFileInput.current?.click();}}>↑ Import statement</button>
            <input ref={statementFileInput} type="file" accept=".csv,text/csv" style={{display:'none'}} onChange={parseStatementFile} />
          </h3>
          {statementImportError&&<div className="import-error" role="alert">{statementImportError}</div>}
          <form className="add-row" onSubmit={addTx}>
            <input type="text" value={desc} onChange={e=>{const value=e.target.value;setDesc(value);const suggested=inferCategory(value);if(suggested)setCat(suggested);}} placeholder="Description" />
            <input type="number" value={amt} onChange={e=>setAmt(e.target.value)} placeholder="Amount" step="0.01" min="0" />
            <select value={cat} onChange={e=>setCat(e.target.value)}>
              <optgroup label="Income">{CATEGORIES.filter(c=>c.type==='income').map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</optgroup>
              <optgroup label="Expense">{CATEGORIES.filter(c=>c.type==='expense').map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</optgroup>
              <optgroup label="Investments">{CATEGORIES.filter(c=>c.type==='investment').map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</optgroup>
              <optgroup label="Transfers">{CATEGORIES.filter(c=>c.type==='transfer').map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</optgroup>
            </select>
            <input type="date" value={txDate} onChange={e=>setTxDate(e.target.value)} />
            <button type="submit" className="btn btn-p">+ Add</button>
          </form>

          {monthTx.length===0?(
            <div style={{textAlign:'center',padding:'30px',color:'var(--text-dim)',fontSize:13}}>No transactions this month.</div>
          ):(
            <TransactionsTable rows={monthTx} monthKey={key} onUpdate={updateTx} onDelete={deleteTx} />
          )}
        </div>

      </div>

      {statementPreview&&<StatementImportModal preview={statementPreview} onClose={()=>setStatementPreview(null)} onImport={addStatementTransactions} />}
      {/* Goal modal */}
      {syncModal&&<SyncModal config={syncConfig} sessionToken={sessionToken} dirty={dirty} syncing={syncing}
        onClose={()=>setSyncModal(false)} onConfig={saveSyncConfig} onLogin={loginApi} onLogout={logoutApi}
        onPull={pullGitHub} onPush={pushGitHub} status={syncStatus} />}
    </div>
  );
}

function StatementImportModal({preview,onClose,onImport}){
  const [items,setItems]=useState(preview.items);
  const selectedCount=items.filter(item=>item.include).length;
  const duplicateCount=items.filter(item=>item.duplicate).length;
  const updateItem=(index,updates)=>setItems(current=>current.map((item,itemIndex)=>itemIndex===index?{...item,...updates}:item));
  return <div className="modal-ov" onClick={onClose}>
    <div className="modal statement-modal" role="dialog" aria-modal="true" aria-labelledby="statement-import-title" onClick={e=>e.stopPropagation()}>
      <h3 id="statement-import-title">Review statement transactions</h3>
      <div className="statement-summary">
        {preview.fileName} · {items.length} parsed · {preview.skippedRows} skipped · {duplicateCount} possible duplicates · Positive amounts treated as {preview.format==='ANZ'?'deposits':'charges'}
      </div>
      <div className="import-table-wrap">
        <table className="import-table">
          <thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Category</th><th>Include</th></tr></thead>
          <tbody>{items.map((item,index)=>{
            const type=CAT_MAP[item.category]?.type||'expense';
            const marker=type==='income'?'+':type==='investment'?'↗':'−';
            return <tr key={`${item.date}-${index}`} className={item.duplicate?'import-duplicate':''}>
              <td className="import-date">{item.date}</td>
              <td className="import-description">
                {item.desc}
                {item.duplicate&&<span className="import-warning">Possible duplicate</span>}
              </td>
              <td style={{whiteSpace:'nowrap'}}><span className={`tx-type ${type}`}>{marker} $ {fmt(item.amount)}</span></td>
              <td><select value={item.category} aria-label={`Category for ${item.desc}`} onChange={e=>updateItem(index,{category:e.target.value})}>
                <optgroup label="Income">{CATEGORIES.filter(category=>category.type==='income').map(category=><option key={category.id} value={category.id}>{category.label}</option>)}</optgroup>
                <optgroup label="Expenses">{CATEGORIES.filter(category=>category.type==='expense').map(category=><option key={category.id} value={category.id}>{category.label}</option>)}</optgroup>
                <optgroup label="Investments">{CATEGORIES.filter(category=>category.type==='investment').map(category=><option key={category.id} value={category.id}>{category.label}</option>)}</optgroup>
                <optgroup label="Transfers">{CATEGORIES.filter(category=>category.type==='transfer').map(category=><option key={category.id} value={category.id}>{category.label}</option>)}</optgroup>
              </select></td>
              <td><input type="checkbox" aria-label={`Include ${item.desc}`} checked={item.include} onChange={e=>updateItem(index,{include:e.target.checked})} /></td>
            </tr>;
          })}</tbody>
        </table>
      </div>
      <div className="import-actions">
        <span className="statement-summary">{selectedCount} of {items.length} selected</span>
        <div className="macts">
          <button type="button" className="btn btn-g" onClick={onClose}>Cancel</button>
          <button type="button" className="btn btn-p" disabled={!selectedCount} onClick={()=>onImport(items)}>Add transactions</button>
        </div>
      </div>
    </div>
  </div>;
}

function TransactionsTable({rows,monthKey,onUpdate,onDelete}){
  const [query,setQuery]=useState('');
  const [sort,setSort]=useState({key:'date',direction:'desc'});
  const [editingId,setEditingId]=useState(null);
  const [draft,setDraft]=useState(null);

  const visibleRows=useMemo(()=>{
    const needle=query.trim().toLowerCase();
    const filtered=rows.filter(row=>!needle||`${row.date} ${row.desc} ${CAT_MAP[row.category]?.label||row.category}`.toLowerCase().includes(needle));
    return [...filtered].sort((a,b)=>{
      const av=a[sort.key]??'',bv=b[sort.key]??'';
      const an=sort.key==='amount'?Number(av):NaN;
      const comparison=!Number.isNaN(an)&&!Number.isNaN(Number(bv))
        ?an-Number(bv)
        :String(av).localeCompare(String(bv));
      return sort.direction==='asc'?comparison:-comparison;
    });
  },[rows,query,sort]);

  const startEdit=row=>{setEditingId(row.id);setDraft({...row});};
  const cancelEdit=()=>{setEditingId(null);setDraft(null);};
  const saveEdit=()=>{
    if(!draft)return;
    const category=CAT_MAP[draft.category];
    onUpdate(monthKey,{...draft,amount:Number(draft.amount)||0,type:category?.type||'expense'});
    cancelEdit();
  };
  const toggleSort=key=>setSort(current=>current.key===key
    ?{key,direction:current.direction==='asc'?'desc':'asc'}
    :{key,direction:'asc'});
  const sortLabel=key=>sort.key===key?(sort.direction==='asc'?'↑':'↓'):'';

  return <>
    <div className="table-tools">
      <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Filter rows..." aria-label="Filter transaction rows" />
      {[
        {key:'date',label:'Date'},
        {key:'desc',label:'Description'},
        {key:'category',label:'Category'},
        {key:'amount',label:'Amount'},
      ].map(column=><button key={column.key} className="sort-btn" onClick={()=>toggleSort(column.key)}>
        Sort {column.label} {sortLabel(column.key)}
      </button>)}
      <span className="count">{visibleRows.length} of {rows.length} rows</span>
    </div>
    <div style={{overflowX:'auto'}}>
      <table className="tx-table">
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th style={{textAlign:'right'}}>Amount</th><th></th></tr></thead>
        <tbody>
          {visibleRows.map(row=>editingId===row.id
            ? <TransactionEditRow key={row.id} draft={draft} setDraft={setDraft} onSave={saveEdit} onCancel={cancelEdit} />
            : <TransactionViewRow key={row.id} row={row} onEdit={startEdit} onDelete={onDelete} />)}
        </tbody>
      </table>
    </div>
  </>;
}

function TransactionViewRow({row,onEdit,onDelete}){
  const category=CAT_MAP[row.category];
  const investment=isInvestment(row);
  const transfer=row.category==='transfer'||row.type==='transfer';
  return <tr>
    <td style={{fontSize:12,color:'var(--text-dim)',whiteSpace:'nowrap'}}>{row.date}</td>
    <td>{row.desc}</td>
    <td><span className="tx-cat-badge" style={{background:(category?.color||'#666')+'20',color:category?.color||'var(--text-sec)'}}>{category?.icon} {category?.label||row.category}</span></td>
    <td style={{textAlign:'right'}}><span className={`tx-type ${investment?'investment':transfer?'transfer':row.type}`}>{investment?'↗':transfer?'↔':row.type==='income'?'+':'-'} ${fmt(Number(row.amount)||0)}</span></td>
    <td><div className="tx-acts"><button className="abtn" onClick={()=>onEdit(row)}>Edit</button><button className="abtn del" onClick={()=>onDelete(row.id)}>✕</button></div></td>
  </tr>;
}

function TransactionEditRow({draft,setDraft,onSave,onCancel}){
  const setValue=(key,value)=>setDraft({...draft,[key]:value});
  const setDescription=value=>{const suggested=inferCategory(value);setDraft({...draft,desc:value,...(suggested?{category:suggested}:{}),});};
  return <tr>
    <td><input className="edit-cell" type="date" value={draft.date||''} onChange={e=>setValue('date',e.target.value)} /></td>
    <td><input className="edit-cell" value={draft.desc||''} onChange={e=>setDescription(e.target.value)} /></td>
    <td><select className="edit-cell" value={draft.category||''} onChange={e=>setValue('category',e.target.value)}>
      <optgroup label="Income">{CATEGORIES.filter(c=>c.type==='income').map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</optgroup>
      <optgroup label="Expense">{CATEGORIES.filter(c=>c.type==='expense').map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</optgroup>
      <optgroup label="Investments">{CATEGORIES.filter(c=>c.type==='investment').map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</optgroup>
      <optgroup label="Transfers">{CATEGORIES.filter(c=>c.type==='transfer').map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</optgroup>
    </select></td>
    <td><input className="edit-cell" type="number" min="0" step="0.01" value={draft.amount??''} onChange={e=>setValue('amount',e.target.value)} /></td>
    <td><div className="row-edit-actions"><button className="abtn save" onClick={onSave}>Save</button><button className="abtn cancel" onClick={onCancel}>Cancel</button></div></td>
  </tr>;
}

function SyncModal({config,sessionToken,dirty,syncing,onClose,onConfig,onLogin,onLogout,onPull,onPush,status}){
  const [password,setPassword]=useState('');
  const saveSettings=()=>config;
  return <div className="modal-ov" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <h3>Budget Sync</h3>
    {!sessionToken&&<div className="fg"><label>Password</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} autoComplete="current-password" onKeyDown={async e=>{if(e.key==='Enter'&&!syncing&&await onLogin(saveSettings(),password))setPassword('');}} />{status&&<div className="hint">{status}</div>}</div>}
    <div className="sync-note">Status: {status}{dirty?' · local changes need backup':''}</div>
    <div className="sync-actions"><button className="btn btn-g" onClick={onClose}>Close</button>{sessionToken?<><button className="btn btn-g" disabled={syncing} onClick={()=>{const settings=saveSettings();onConfig(settings);onPull(settings);}}>↓ Pull latest</button><button className="btn btn-p" disabled={syncing} onClick={()=>{const settings=saveSettings();onConfig(settings);onPush(settings);}}>↑ Save local data</button><button className="btn btn-g" disabled={syncing} onClick={()=>onLogout(saveSettings())}>Sign out</button></>:<button className="btn btn-p" disabled={syncing||!password.trim()} onClick={async()=>{if(await onLogin(saveSettings(),password))setPassword('');}}>{syncing?'Signing in...':'Sign in'}</button>}</div>
  </div></div>;
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
